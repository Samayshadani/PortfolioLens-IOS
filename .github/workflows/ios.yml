name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' in runtime:
                  for d in devices[runtime]:
                      if d['name'].startswith('iPhone'):
                          print(d['udid']); sys.exit()
          ")
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PortfolioLens.xcodeproj \
            -scheme PortfolioLens \
            -destination "id=$SIM_UDID" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            | tee xcodebuild-test.log

      - name: Build simulator app for sharing (Appetize.io)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PortfolioLens.xcodeproj \
            -scheme PortfolioLens \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            | tee xcodebuild-build.log
          cd build/Build/Products/Release-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/PortfolioLens-simulator.zip" PortfolioLens.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioLens-simulator
          path: PortfolioLens-simulator.zip

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: xcodebuild-*.log
